<script id="nt-order-demo-v214-patch">
(function(){
'use strict';
function decodeSource(){const raw=atob(window.NT_ORDER_DEMO_SOURCE_B64||'');const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
function demoHtml(role){let h=decodeSource();const q=role==='admin'?'?mode=admin&view=admin&npp=npp1':'?mode=order&view=customer&npp=npp1';return h.replace('<head>','<head><script>window.__NT_MASTER_DEMO_QUERY='+JSON.stringify(q)+';<\/script>',1)}
function setSwitch(role){document.querySelectorAll('#ntSuiteOrderSwitch button[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role))}
window.ntSuiteOrderDemoRole=function(role='customer'){const f=document.getElementById('ntSuiteOrderFrame');if(!f)return;f.removeAttribute('src');f.srcdoc=demoHtml(role);f.dataset.role=role;setSwitch(role);const n=document.getElementById('ntSuiteOrderFrameNote');if(n)n.textContent=role==='admin'?'Quản trị NPP • Demo nội bộ Master, dữ liệu riêng hoàn toàn.':'Đặt hàng • Demo nội bộ Master, giữ đủ dữ liệu mẫu của Order.'};
const oldOpenCurrent=window.ntSuiteOpenCurrentDemo;
window.ntSuiteOpenCurrentDemo=function(kind){if(kind==='order'){const f=document.getElementById('ntSuiteOrderFrame'),role=f?.dataset.role||'customer';const w=window.open('','_blank');if(!w)return;w.document.open();w.document.write(demoHtml(role));w.document.close();return}return oldOpenCurrent?oldOpenCurrent(kind):undefined};
})();
</script>

<style id="nt-master-v217-source-css">
#masterChildSourceCard .btn{white-space:nowrap}
#masterChildSourceStatus .ok{color:#15803d;font-weight:800}
#masterChildSourceStatus .warn{color:#b45309;font-weight:800}

<script id="nt-master-v217-source-js">
(function(){
  const SOURCE_KEY_PREFIX='master_child_html_source_v217::';
  function sourceKey(appId){return SOURCE_KEY_PREFIX+String(appId||'').trim().toUpperCase()}
  async function idbGet(key){
    const idb=await openAppDB();
    return await new Promise((resolve,reject)=>{
      const tx=idb.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(key);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error('Không đọc được mã nguồn'));
      tx.oncomplete=()=>{try{idb.close()}catch(_){}};
      tx.onabort=()=>{try{idb.close()}catch(_){}};
    });
  }
  async function idbPut(key,value){
    const idb=await openAppDB();
    return await new Promise((resolve,reject)=>{
      const tx=idb.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(value,key);
      tx.oncomplete=()=>{try{idb.close()}catch(_){} resolve(true)};
      tx.onerror=()=>{const e=tx.error||new Error('Không lưu được mã nguồn');try{idb.close()}catch(_){} reject(e)};
      tx.onabort=()=>{const e=tx.error||new Error('Lưu mã nguồn bị hủy');try{idb.close()}catch(_){} reject(e)};
    });
  }
  function sourceMetaUpdate(appId,obj){
    try{
      const rec=masterRegistryLoad().find(x=>x.appId===appId);
      if(!rec)return;
      rec.sourceSaved=true;
      rec.sourceSavedAt=obj.savedAt||new Date().toISOString();
      rec.sourceFileName=obj.fileName||((appId||'APP')+'_MANAGER.html');
      rec.sourceBytes=Number(obj.bytes||new Blob([obj.html||'']).size)||0;
      rec.sourceOrigin=obj.origin||rec.sourceOrigin||'saved';
      masterRegistryUpsert(rec);
    }catch(e){console.warn('Không ghi metadata mã nguồn:',e)}
  }
  window.masterChildSourceRead=async function(appId){
    return await idbGet(sourceKey(appId));
  };
  window.masterChildSourceWrite=async function(appId,html,meta={}){
    appId=String(appId||'').trim();
    html=String(html||'');
    if(!appId)throw new Error('Thiếu APP ID');
    if(!/^\s*<!doctype html>/i.test(html)||!html.includes('const APP_CONFIG=Object.freeze('))throw new Error('HTML không đúng mẫu App Manager');
    const obj={
      appId,html,
      fileName:meta.fileName||((appId+'_MANAGER.html').replace(/[^A-Z0-9_.-]/gi,'_')),
      savedAt:new Date().toISOString(),
      version:String(meta.version||window.MASTER_CHILD_TEMPLATE_VERSION||''),
      origin:meta.origin||'saved',
      bytes:new Blob([html]).size
    };
    await idbPut(sourceKey(appId),obj);
    sourceMetaUpdate(appId,obj);
    setTimeout(()=>sourceMetaUpdate(appId,obj),450);
    try{masterChildSourceRefreshUI()}catch(_){}
    return obj;
  };
  function selectedManagerRec(){
    const rec=typeof masterRegistrySelected==='function'?masterRegistrySelected():null;
    if(!rec)return null;
    if(typeof masterIsOrder==='function'&&masterIsOrder(rec))return null;
    if(rec.appType==='fnb'||rec.appType==='order-shared')return null;
    return rec;
  }
  function applyCurrentConfigToSource(html,cfg){
    html=String(html||'');
    const configCode='const APP_CONFIG=Object.freeze('+JSON.stringify(cfg)+');';
    if(/const APP_CONFIG=Object\.freeze\([^\n]*\);/.test(html))html=html.replace(/const APP_CONFIG=Object\.freeze\([^\n]*\);/,configCode);
    html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>'+String(cfg.appName||cfg.unitName||cfg.appId||'Manager').replace(/[<>&]/g,'')+' - Quản lý nội bộ</title>');
    try{
      if(window.NT_MANAGER_DEFAULT_ICON_DATA_URL){
        const tag='<link rel="icon" type="image/png" href="'+NT_MANAGER_DEFAULT_ICON_DATA_URL+'"><link rel="apple-touch-icon" href="'+NT_MANAGER_DEFAULT_ICON_DATA_URL+'">';
        html=html.replace(/<link rel="icon"[^>]*>/ig,'').replace(/<link rel="apple-touch-icon"[^>]*>/ig,'');
        html=html.replace(/<\/head>/i,tag+'</head>');
      }
    }catch(_){}
    return html;
  }
  window.masterChildSourceRefreshUI=async function(){
    const card=document.getElementById('masterChildSourceCard');
    const st=document.getElementById('masterChildSourceStatus');
    if(!card||!st)return;
    const rec=selectedManagerRec();
    if(!rec){card.style.display='none';return}
    card.style.display='block';
    st.textContent='Đang kiểm tra mã nguồn của '+(rec.unitName||rec.appName||rec.appId)+'...';
    try{
      const obj=await masterChildSourceRead(rec.appId);
      if(obj?.html){
        const kb=(Number(obj.bytes||new Blob([obj.html]).size)/1024).toFixed(0);
        const d=obj.savedAt?new Date(obj.savedAt).toLocaleString('vi-VN'):'';
        st.innerHTML='<span class="ok">✅ Đã lưu mã nguồn riêng</span> • '+esc(obj.fileName||'HTML')+' • '+kb+' KB'+(d?' • '+esc(d):'');
      }else{
        st.innerHTML='<span class="warn">⚠ Chưa có mã nguồn riêng</span> • Bấm “Tạo lại từ mẫu chuẩn” để tạo đúng APP ID hiện tại.';
      }
    }catch(e){st.innerHTML='<span class="warn">⚠ Chưa đọc được mã nguồn</span> • '+esc(e.message||String(e))}
  };
  window.masterChildSourceRebuildSelected=async function(){
    const rec=(typeof masterCollectSelectedForm==='function'?masterCollectSelectedForm():null)||selectedManagerRec();
    if(!rec)return alert('Chọn một App Manager trước.');
    if(typeof masterIsOrder==='function'&&masterIsOrder(rec))return alert('Chức năng này chỉ dùng cho App Manager.');
    if(rec.externalManaged&&rec.externalKey!=='an-bui')return alert('App ngoài không dùng mẫu Manager chuẩn của Master.');
    if(!confirm('Tạo mã nguồn HTML riêng cho '+(rec.unitName||rec.appName||rec.appId)+' từ mẫu Manager chuẩn?\n\nAPP ID, PIN và mã đồng bộ hiện tại sẽ được giữ nguyên.'))return;
    try{
      masterRegistryUpsert(rec);
      const cfg=masterUpgradeConfig(rec);
      const html=serializeFreshMasterHtmlForApp(cfg);
      if(!html)throw new Error('Không dựng được HTML từ mẫu chuẩn');
      const fileName=(cfg.appId+'_MANAGER_SOURCE.html').replace(/[^A-Z0-9_.-]/gi,'_');
      await masterChildSourceWrite(rec.appId,html,{fileName,origin:'rebuilt',version:String(MASTER_CHILD_TEMPLATE_VERSION)});
      renderMasterControl();renderMasterNpp();
      toast('Đã tạo và lưu mã nguồn riêng cho '+(rec.unitName||rec.appId));
    }catch(e){alert('Không tạo được mã nguồn:\n'+(e.message||e))}
  };
  window.masterChildSourceDownloadSelected=async function(){
    const rec=selectedManagerRec();
    if(!rec)return alert('Chọn một App Manager trước.');
    try{
      let obj=await masterChildSourceRead(rec.appId);
      if(!obj?.html)return alert('App này chưa có mã nguồn riêng. Bấm “Tạo lại từ mẫu chuẩn” trước.');
      const cfg=masterUpgradeConfig((typeof masterCollectSelectedForm==='function'?masterCollectSelectedForm():null)||rec);
      const html=applyCurrentConfigToSource(obj.html,cfg);
      obj=await masterChildSourceWrite(rec.appId,html,{fileName:obj.fileName||((rec.appId+'_MANAGER_SOURCE.html').replace(/[^A-Z0-9_.-]/gi,'_')),origin:obj.origin||'saved',version:obj.version||String(MASTER_CHILD_TEMPLATE_VERSION)});
      const u=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      const a=document.createElement('a');a.href=u;a.download=obj.fileName||((rec.appId+'_MANAGER_SOURCE.html').replace(/[^A-Z0-9_.-]/gi,'_'));document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000);
      toast('Đã tải HTML nguồn riêng của '+(rec.unitName||rec.appId));
    }catch(e){alert('Không tải được mã nguồn:\n'+(e.message||e))}
  };
  window.masterChildSourceAttachSelected=async function(ev){
    const input=ev?.target;const f=input?.files?.[0];if(input)input.value='';if(!f)return;
    const rec=selectedManagerRec();if(!rec)return alert('Chọn một App Manager trước.');
    try{
      const html=await f.text();
      if(!/^\s*<!doctype html>/i.test(html)||!html.includes('const APP_CONFIG=Object.freeze('))throw new Error('File không phải App Manager chuẩn');
      let fileAppId='';
      const m=html.match(/const APP_CONFIG=Object\.freeze\((\{[^\n]*\})\);/);
      if(m){try{fileAppId=String(JSON.parse(m[1]).appId||'')}catch(_){}}
      if(fileAppId&&fileAppId!==rec.appId){
        if(!confirm('File này có APP ID '+fileAppId+' nhưng app đang chọn là '+rec.appId+'.\n\nKhông nên gắn nhầm mã nguồn. Vẫn tiếp tục và đổi cấu hình file về '+rec.appId+'?'))return;
      }
      const cfg=masterUpgradeConfig((typeof masterCollectSelectedForm==='function'?masterCollectSelectedForm():null)||rec);
      const fixed=applyCurrentConfigToSource(html,cfg);
      await masterChildSourceWrite(rec.appId,fixed,{fileName:f.name||((rec.appId+'_MANAGER_SOURCE.html').replace(/[^A-Z0-9_.-]/gi,'_')),origin:'attached',version:String(cfg.appVersion||MASTER_CHILD_TEMPLATE_VERSION)});
      renderMasterControl();renderMasterNpp();toast('Đã gắn HTML đã sửa vào '+(rec.unitName||rec.appId));
    }catch(e){alert('Không gắn được file HTML:\n'+(e.message||e))}
  };
  // Nâng cấp riêng: ưu tiên mã nguồn riêng đã lưu; nếu chưa có mới dùng mẫu chung.
  masterDownloadUpgrade=async function(){
    const rec=masterCollectSelectedForm();
    if(!rec)return;
    const isAnBui=rec.externalKey==='an-bui';
    if(rec.externalManaged&&!isAnBui){
      return alert(masterIsOrder(rec)?'Smart Order dùng mã nguồn Order riêng; Master không xuất file Manager cho Order.':'App ngoài chưa dùng khuôn Manager chuẩn của Master.');
    }
    try{
      masterRegistryUpsert(rec);
      const cfg=masterUpgradeConfig(rec);
      let obj=await masterChildSourceRead(rec.appId);
      let html='';
      if(obj?.html){
        html=applyCurrentConfigToSource(obj.html,cfg);
        obj=await masterChildSourceWrite(rec.appId,html,{fileName:obj.fileName||((cfg.appId+'_MANAGER_SOURCE.html').replace(/[^A-Z0-9_.-]/gi,'_')),origin:obj.origin||'saved',version:obj.version||String(MASTER_CHILD_TEMPLATE_VERSION)});
      }else{
        html=serializeFreshMasterHtmlForApp(cfg);
        if(html) obj=await masterChildSourceWrite(rec.appId,html,{fileName:(cfg.appId+'_MANAGER_SOURCE.html').replace(/[^A-Z0-9_.-]/gi,'_'),origin:'auto-rebuilt',version:String(MASTER_CHILD_TEMPLATE_VERSION)});
      }
      if(!html)throw new Error('Không tạo được file nâng cấp.');
      const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=(cfg.appId+'_MANAGER_UPGRADE.html').replace(/[^A-Z0-9_.-]/gi,'_');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
      rec.version=String(cfg.appVersion||MASTER_CHILD_TEMPLATE_VERSION);rec.targetVersion=rec.version;rec.templateRelease=window.MASTER_CHILD_TEMPLATE_RELEASE||rec.templateRelease;rec.sourceSaved=true;rec.sourceSavedAt=obj?.savedAt||new Date().toISOString();masterRegistryUpsert(rec);
      if(rec.online)masterControlRemoteSet(rec).catch(e=>console.warn(e));
      renderMasterControl();renderMasterNpp();toast('Đã tạo file nâng cấp RIÊNG cho '+(rec.unitName||cfg.appId));
    }catch(e){alert('Không tạo được file nâng cấp riêng:\n'+(e.message||e))}
  };
  // Gọi lại trạng thái mỗi khi mở chi tiết app.
  const oldRender=window.renderMasterNpp;
  if(typeof oldRender==='function'){
    window.renderMasterNpp=function(){const r=oldRender.apply(this,arguments);setTimeout(()=>masterChildSourceRefreshUI(),20);return r};
    try{renderMasterNpp=window.renderMasterNpp}catch(_){}
  }
  const oldSelect=window.masterSelectApp;
  if(typeof oldSelect==='function'){
    window.masterSelectApp=async function(id){const r=await oldSelect.call(this,id);setTimeout(()=>masterChildSourceRefreshUI(),40);return r};
    try{masterSelectApp=window.masterSelectApp}catch(_){}
  }
  setTimeout(()=>{try{masterChildSourceRefreshUI()}catch(_){}},900);
})();
</script>

<script src="./master-order-v204.js?v=221"></script>
<script id="nt-master-v221-order-login">

let masterOrderRootTokenV219='';
async function masterOrderRequestV219(path,body,tenant='npp1',token=''){
  const u=new URL(path,MASTER_ORDER_CHILD_URL);u.searchParams.set('tenant',tenant);
  let response;
  try{response=await fetch(u.href,{method:'POST',headers:{'content-type':'application/json','x-order-tenant':tenant,...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)})}
  catch(e){throw new Error('Không kết nối được Smart Order. Kiểm tra Internet rồi bấm xuất lại.');}
  const payload=await response.json().catch(()=>({}));
  if(!response.ok){if(response.status===401&&path==='/api/child-app'&&body.action==='provision'){masterOrderRootTokenV219='';const box=document.getElementById('orderChildRootAuth');if(box){box.style.display='';box.open=true}}
    throw new Error(payload.error||'Chưa tạo được tài khoản app con.');}
  return payload;
}
async function masterOrderProvisionV219(rec){
  if(!masterOrderRootTokenV219){
    const phone=String(document.getElementById('orderRootPhone')?.value||'').trim(),pin=String(document.getElementById('orderRootPin')?.value||'').trim();
    if(!phone||!pin)throw new Error('Điền SĐT và PIN xác nhận cấp app con ở mục “Xác nhận quyền xuất app con”.');
    const login=await masterOrderRequestV219('/api/master-authorize',{action:'login',phone,pin},'npp1');
    if(!login.token)throw new Error('Chưa xác nhận được quyền xuất app con.');masterOrderRootTokenV219=login.token;
    const input=document.getElementById('orderRootPin');if(input)input.value='';
  }
  return await masterOrderRequestV219('/api/child-app',{action:'provision',tenant:masterOrderTenantId(rec.appId),phone:rec.adminPhone||rec.phone,openPin:rec.appOpenPin,managerPin:rec.managerPin,unitName:rec.unitName},'npp1',masterOrderRootTokenV219);
}
const masterRenderNppV219=renderMasterNpp;
renderMasterNpp=function(){
  const r=masterRenderNppV219.apply(this,arguments),rec=masterRegistrySelected(),btn=document.getElementById('masterOrderChildBtn');
  if(btn&&rec?.appType==='order-child'){btn.style.display='';btn.textContent='⬇ Xuất lại / Sửa đăng nhập App Order';}
  return r;
};

</script>
