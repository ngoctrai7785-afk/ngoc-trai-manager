<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6674"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>Smart Order Ngọc Trai</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef4f7}#app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#fff}.cover{position:fixed;inset:0;z-index:99;background:rgba(238,244,247,.98);display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #d5e2e6;border-radius:20px;padding:28px;text-align:center;box-shadow:0 16px 50px #163b6b22}.logo{width:82px;height:82px;border-radius:18px;margin-bottom:12px}.state{font-weight:800;font-size:20px;color:#17324d}.msg{color:#607786;line-height:1.55;margin-top:10px}.ok{display:none}.small{font-size:12px;color:#7d909a;margin-top:14px}</style></head><body><iframe id="app" title="Smart Order Ngọc Trai"></iframe><div id="cover" class="cover"><div class="card"><img class="logo" src="./icon-192.png"><div id="state" class="state">Đang kiểm tra quyền sử dụng…</div><div id="msg" class="msg">Vui lòng chờ trong giây lát.</div><div class="small">N-TRAI Master Control</div></div></div><script>
const CFG={appId:'SMART_ORDER_NGOC_TRAI',pin:'26882688',version:26,syncUrl:'https://upojgdqkkjwtbrzljffo.supabase.co',key:'sb_publishable_6b_dKKWTQr64yptqlcSPPA_Ww7achl0',core:'https://smart-order-ngoc-trai.ngoctrai7785.chatgpt.site/smart-order-v26'};
const frame=document.getElementById('app'),cover=document.getElementById('cover'),state=document.getElementById('state'),msg=document.getElementById('msg');let started=false,checking=false;
function coreUrl(){const u=new URL(CFG.core);u.searchParams.set('mode','order');u.searchParams.set('view','customer');u.searchParams.set('npp','npp1');return u.href}
function expired(d){if(!d)return false;const today=new Date().toISOString().slice(0,10);return String(d).slice(0,10)<today}
function block(title,text){cover.style.display='grid';state.textContent=title;msg.textContent=text}
function allow(){if(!started){frame.src=coreUrl();started=true}cover.style.display='none'}
async function check(){if(checking)return;checking=true;try{const r=await fetch(CFG.syncUrl+'/rest/v1/rpc/manager_app_control_get',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.key,'Authorization':'Bearer '+CFG.key},body:JSON.stringify({p_app_id:CFG.appId,p_pin:CFG.pin,p_client_version:CFG.version,p_public_url:location.href.split('#')[0]})});if(!r.ok)throw new Error('HTTP '+r.status);const c=await r.json();if(String(c?.status||'active')==='locked')block('App đang tạm khóa','Smart Order đã được khóa từ Master. Vui lòng liên hệ nhà cung cấp để mở lại.');else if(expired(c?.expires_at))block('App đã hết hạn','Hạn sử dụng đã kết thúc. Vui lòng liên hệ để gia hạn.');else if(c?.origin_allowed===false)block('Đường dẫn chưa được cấp phép','Hãy mở đúng đường dẫn Smart Order do Master cung cấp.');else allow()}catch(e){block('Không kiểm tra được Master','Cần Internet để xác nhận quyền sử dụng. Vui lòng kiểm tra mạng rồi mở lại.')}finally{checking=false}}
check();setInterval(check,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});window.addEventListener('focus',check);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
